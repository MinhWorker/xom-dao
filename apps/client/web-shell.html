<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#000000">
		<title>Xóm Đảo</title>
		<style>
			:root {
				color-scheme: light;
				font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
				font-synthesis: none;
				--navy: #19344d;
				--cream: #fff6dd;
				--gold: #f4bd49;
				--teal: #159eaa;
				--sky: #68c9e8;
			}

			html,
			body,
			#canvas {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				border: 0;
			}

			body {
				overflow: hidden;
				background: var(--sky);
				touch-action: none;
			}

			#canvas {
				display: block;
				outline: none;
			}

			#status {
				position: fixed;
				inset: 0;
				z-index: 10;
				display: grid;
				place-items: center;
				overflow: hidden;
				isolation: isolate;
				color: var(--navy);
				background:
					radial-gradient(ellipse at 50% 59%, rgba(255, 255, 255, 0.34), transparent 37%),
					linear-gradient(180deg, #53b9ea 0%, #8bd9e8 58%, #c5eee1 76%, #55c4c5 100%);
				visibility: visible;
			}

			#status::before {
				position: absolute;
				z-index: -1;
				right: -8%;
				bottom: -9%;
				left: -8%;
				height: 39%;
				border-radius: 50% 50% 0 0 / 15% 15% 0 0;
				background: linear-gradient(180deg, rgba(51, 190, 193, 0.9), #179eaa 72%, #128894);
				box-shadow: 0 -9px 34px rgba(33, 153, 170, 0.17);
				content: "";
			}

			.sky-glow {
				position: absolute;
				z-index: -1;
				top: 13%;
				left: 50%;
				width: min(78vmin, 920px);
				aspect-ratio: 1;
				border-radius: 50%;
				background: radial-gradient(circle, rgba(255, 247, 202, 0.4), rgba(255, 247, 202, 0.1) 36%, transparent 70%);
				transform: translateX(-50%);
			}

			.cloud {
				position: absolute;
				z-index: 0;
				width: clamp(110px, 17vw, 260px);
				color: rgba(242, 255, 250, 0.65);
				filter: drop-shadow(0 8px 10px rgba(31, 112, 149, 0.08));
				animation: cloud-drift 9s ease-in-out infinite alternate;
			}

			.cloud svg,
			.birds svg,
			.island-mark svg,
			.loading-mark svg {
				display: block;
				width: 100%;
				height: auto;
			}

			.cloud-left {
				top: 19%;
				left: -1.5%;
			}

			.cloud-right {
				top: 29%;
				right: -2%;
				width: clamp(90px, 13vw, 205px);
				animation-delay: -4s;
			}

			.birds {
				position: absolute;
				z-index: 1;
				top: 27%;
				left: calc(50% + clamp(70px, 15vw, 240px));
				width: clamp(34px, 5vw, 70px);
				color: #fff9d9;
				opacity: 0.9;
			}

			.horizon {
				position: absolute;
				z-index: 0;
				right: 0;
				bottom: 22%;
				left: 0;
				height: clamp(42px, 11vh, 115px);
				pointer-events: none;
			}

			.horizon svg,
			.wave svg {
				display: block;
				width: 100%;
				height: 100%;
			}

			.wave {
				position: absolute;
				z-index: 1;
				right: 0;
				bottom: 0;
				left: 0;
				height: 22%;
				min-height: 62px;
				pointer-events: none;
				opacity: 0.56;
			}

			.wave svg {
				position: absolute;
				bottom: 70%;
				height: clamp(28px, 7vh, 70px);
			}

			.brand {
				position: absolute;
				z-index: 3;
				top: max(14px, calc(env(safe-area-inset-top, 0px) + 8px));
				left: 50%;
				display: flex;
				align-items: center;
				gap: 9px;
				color: white;
				text-shadow: 0 2px 9px rgba(28, 90, 125, 0.26);
				transform: translateX(-50%);
				white-space: nowrap;
			}

			.island-mark {
				width: 46px;
				filter: drop-shadow(0 2px 4px rgba(22, 92, 112, 0.2));
			}

			.brand-copy {
				display: grid;
				gap: 1px;
			}

			.brand-name {
				font-size: clamp(18px, 2.6vh, 25px);
				font-weight: 900;
				letter-spacing: 0.14em;
				line-height: 1;
			}

			.brand-note {
				color: #fff4cc;
				font-size: 10px;
				font-weight: 800;
				letter-spacing: 0.16em;
			}

			.island-art {
				position: absolute;
				z-index: 2;
				top: 50%;
				left: 50%;
				width: clamp(205px, 49vh, 520px);
				aspect-ratio: 1;
				transform: translate(-50%, -52%);
				animation: island-bob 5s ease-in-out infinite;
			}

			.island-art::before {
				position: absolute;
				inset: -15px;
				border: 1px dashed rgba(255, 252, 222, 0.74);
				border-radius: 50%;
				box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.07), 0 0 35px rgba(255, 255, 255, 0.2);
				content: "";
			}

			.island-art::after {
				position: absolute;
				z-index: -1;
				right: 12%;
				bottom: -11%;
				left: 12%;
				height: 15%;
				border-radius: 50%;
				background: rgba(15, 104, 135, 0.28);
				filter: blur(13px);
				content: "";
			}

			.island-art img {
				display: block;
				width: 100%;
				height: 100%;
				border: 7px solid rgba(255, 248, 220, 0.98);
				border-radius: 50%;
				background: #58bff0;
				box-shadow: 0 15px 34px rgba(27, 84, 119, 0.2), 0 0 0 4px rgba(229, 177, 77, 0.92);
				object-fit: cover;
			}

			.loader-card {
				position: absolute;
				z-index: 4;
				bottom: max(15px, calc(env(safe-area-inset-bottom, 0px) + 10px));
				left: 50%;
				width: min(700px, calc(100% - 36px));
				box-sizing: border-box;
				padding: 19px 25px 21px;
				border: 1px solid rgba(255, 255, 255, 0.75);
				border-radius: 17px;
				background: rgba(255, 248, 222, 0.9);
				box-shadow: 0 9px 26px rgba(13, 83, 105, 0.18), inset 0 1px 0 white;
				backdrop-filter: blur(9px);
				transform: translateX(-50%);
			}

			.loading-caption {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 14px;
				margin-bottom: 12px;
				color: var(--navy);
				font-size: 18px;
				font-weight: 800;
				letter-spacing: 0.025em;
			}

			.loading-label {
				display: flex;
				min-width: 0;
				align-items: center;
				gap: 10px;
			}

			#status-label {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			#status-percent {
				min-width: 3.5ch;
				color: #80601e;
				font-size: 19px;
				font-variant-numeric: tabular-nums;
				font-weight: 900;
				text-align: right;
			}

			.loading-mark {
				width: 24px;
				flex: 0 0 auto;
				color: var(--teal);
			}

			.progress-track {
				position: relative;
				height: 20px;
				overflow: hidden;
				border-radius: 999px;
				background: #d9e2ca;
				box-shadow: inset 0 1px 2px rgba(39, 84, 58, 0.14);
			}

			.progress-sheen {
				position: absolute;
				z-index: 0;
				top: 0;
				left: 0;
				width: 36%;
				height: 100%;
				border-radius: 999px;
				background: linear-gradient(90deg, #e7a632, #ffd86c);
				box-shadow: 0 0 12px rgba(240, 182, 58, 0.5);
				animation: sail 1.9s ease-in-out infinite;
			}

			.progress-track.is-measured .progress-sheen {
				display: none;
			}

			#status-progress {
				position: absolute;
				z-index: 1;
				inset: 0;
				display: block;
				width: 100%;
				height: 100%;
				margin: 0;
				appearance: none;
				border: 0;
				background: transparent;
				color: var(--gold);
			}

			#status-progress::-webkit-progress-bar {
				border-radius: 999px;
				background: transparent;
			}

			#status-progress::-webkit-progress-value {
				border-radius: 999px;
				background: linear-gradient(90deg, #e7a632, #ffd86c);
				box-shadow: 0 0 12px rgba(240, 182, 58, 0.5);
			}

			#status-progress::-moz-progress-bar {
				border-radius: 999px;
				background: linear-gradient(90deg, #e7a632, #ffd86c);
				box-shadow: 0 0 12px rgba(240, 182, 58, 0.5);
			}

			#status-notice {
				display: none;
				margin: 0;
				padding: 10px 3px 1px;
				color: #8e3441;
				font-size: 13px;
				line-height: 1.45;
				text-align: center;
				white-space: normal;
			}

			.noscript {
				position: absolute;
				z-index: 20;
				bottom: 18px;
				left: 50%;
				padding: 10px 15px;
				border-radius: 12px;
				background: var(--cream);
				color: var(--navy);
				font-size: 13px;
				transform: translateX(-50%);
				white-space: nowrap;
			}

			@keyframes island-bob {
				0%, 100% { margin-top: 0; }
				50% { margin-top: -9px; }
			}

			@keyframes cloud-drift {
				from { translate: 0 0; }
				to { translate: 9px -4px; }
			}

			@keyframes sail {
				0% { transform: translateX(-110%); }
				100% { transform: translateX(290%); }
			}

			@media (max-height: 480px) {
				.island-art {
					width: clamp(168px, 49vh, 225px);
					top: 49%;
				}

				.brand {
					top: max(8px, calc(env(safe-area-inset-top, 0px) + 4px));
				}

				.island-mark {
					width: 34px;
				}

				.loader-card {
					bottom: max(8px, calc(env(safe-area-inset-bottom, 0px) + 5px));
					padding: 12px 18px 14px;
				}

				.loading-caption {
					gap: 10px;
					margin-bottom: 8px;
					font-size: 15px;
				}

				.loading-mark {
					width: 20px;
				}

				#status-percent {
					font-size: 16px;
				}

				.progress-track {
					height: 18px;
				}

				.cloud-left { top: 20%; }
				.cloud-right { top: 27%; }
			}

			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					animation-duration: 0.01ms !important;
					animation-iteration-count: 1 !important;
					scroll-behavior: auto !important;
				}
			}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas" aria-label="Xóm Đảo">
			Trình duyệt của bạn không hỗ trợ canvas.
		</canvas>

		<noscript><div class="noscript">Hãy bật JavaScript để vào Xóm Đảo.</div></noscript>

		<div id="status" role="status" aria-live="polite" aria-label="Đang tải Xóm Đảo">
			<div class="sky-glow" aria-hidden="true"></div>
			<div class="cloud cloud-left" aria-hidden="true">
				<svg viewBox="0 0 240 100" fill="none" aria-hidden="true"><path d="M20 67c0-16 13-29 30-29 7-21 27-34 49-31 18 2 33 15 38 32 6-5 13-8 21-8 18 0 32 14 32 32h9c18 0 32 12 32 27H25C10 90 1 81 1 69c0-1 7-2 19-2Z" fill="currentColor"/></svg>
			</div>
			<div class="cloud cloud-right" aria-hidden="true">
				<svg viewBox="0 0 240 100" fill="none" aria-hidden="true"><path d="M20 67c0-16 13-29 30-29 7-21 27-34 49-31 18 2 33 15 38 32 6-5 13-8 21-8 18 0 32 14 32 32h9c18 0 32 12 32 27H25C10 90 1 81 1 69c0-1 7-2 19-2Z" fill="currentColor"/></svg>
			</div>
			<div class="birds" aria-hidden="true">
				<svg viewBox="0 0 80 42" fill="none" aria-hidden="true"><path d="M4 14c5-8 12-8 19 0 6-6 12-6 18 0M39 31c5-7 11-7 17 0 5-5 10-5 15 0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
			</div>
			<div class="horizon" aria-hidden="true">
				<svg viewBox="0 0 1440 140" preserveAspectRatio="none" fill="none" aria-hidden="true"><path d="M0 118 86 72l51 34 105-82 76 87 104-64 89 70 85-89 67 54 81-47 80 68 73-91 57 61 94-45 81 58 87-76 71 63 64-40 88 47v70H0v-32Z" fill="#c5e3c9" fill-opacity=".37"/><path d="m0 131 129-48 62 43 109-63 88 66 124-50 89 45 114-65 113 71 91-58 108 51 105-68 83 57 93-42 132 62v45H0v-46Z" fill="#daf0d9" fill-opacity=".48"/></svg>
			</div>
			<div class="wave" aria-hidden="true">
				<svg viewBox="0 0 1440 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0 42c164 42 264 43 424 12s281-45 441-16 325 50 575-5v67H0V42Z" fill="#daf8df" fill-opacity=".82"/><path d="M0 61c171 25 289 25 429 2 182-29 284-24 454 5 178 31 345 18 557-15v47H0V61Z" fill="#56c9c5" fill-opacity=".75"/></svg>
			</div>

			<div class="brand">
				<div class="island-mark" aria-hidden="true">
					<svg viewBox="0 0 64 46" fill="none" aria-hidden="true"><path d="M5 29c8 3 16 5 27 5s19-2 27-5L47 41H17L5 29Z" fill="#9a6540" stroke="#fff1c7" stroke-width="2" stroke-linejoin="round"/><path d="M7 28c9-6 17-9 25-9s16 3 25 9c-8 4-16 6-25 6S15 32 7 28Z" fill="#6eae45" stroke="#fff1c7" stroke-width="2"/><path d="M32 19V9m0 4-9-5m9 5 8-7m-8 7 10 1" stroke="#f8d96f" stroke-width="2.5" stroke-linecap="round"/><circle cx="32" cy="8" r="4" fill="#4e9f4c"/><path d="M20 26h.1m8-3h.1m8 3h.1m9 1h.1" stroke="#fff3c8" stroke-width="3" stroke-linecap="round"/></svg>
				</div>
				<div class="brand-copy">
					<span class="brand-name">XÓM ĐẢO</span>
					<span class="brand-note">MỘT XÓM · NHIỀU TRÒ VUI</span>
				</div>
			</div>

			<div class="island-art" aria-hidden="true">
				<img src="index.icon.png" alt="">
			</div>

			<div class="loader-card">
				<div class="loading-caption">
					<span class="loading-label">
						<span class="loading-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 15c2.2-1.2 4.4-1.2 6.6 0s4.4 1.2 6.6 0 2.2-1.2 3.8-.6M6 10.5c1.7-.9 3.4-.9 5.1 0s3.4.9 5.1 0 2.5-1 3.8-.4M8.5 6.5c1.2-.6 2.4-.6 3.6 0s2.4.6 3.6 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
						<span id="status-label">Đang tải trò chơi…</span>
					</span>
					<span id="status-percent">…</span>
				</div>
				<div class="progress-track">
					<span class="progress-sheen" aria-hidden="true"></span>
					<progress id="status-progress" aria-label="Tiến trình tải"></progress>
				</div>
				<div id="status-notice" role="alert"></div>
			</div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
			const GODOT_CONFIG = $GODOT_CONFIG;
			const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
			// Let the browser handle F11 before Godot's focused canvas can consume it.
			window.addEventListener('keydown', (event) => {
				if (event.key === 'F11') {
					event.stopImmediatePropagation();
				}
			}, true);

			const engine = new Engine(GODOT_CONFIG);

			((() => {
				const statusOverlay = document.getElementById('status');
				const statusProgress = document.getElementById('status-progress');
				const statusLabel = document.getElementById('status-label');
				const statusPercent = document.getElementById('status-percent');
				const progressTrack = document.querySelector('.progress-track');
				const statusNotice = document.getElementById('status-notice');

				let initializing = true;
				let statusMode = '';

				function setStatusMode(mode) {
					if (statusMode === mode || !initializing) {
						return;
					}
					if (mode === 'hidden') {
						statusOverlay.remove();
						initializing = false;
						return;
					}
					statusOverlay.style.visibility = 'visible';
					statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
					progressTrack.style.display = mode === 'progress' ? 'block' : 'none';
					statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
					statusMode = mode;
				}

				function setStatusNotice(text) {
					while (statusNotice.lastChild) {
						statusNotice.removeChild(statusNotice.lastChild);
					}
					const lines = text.split('\n');
					lines.forEach((line) => {
						statusNotice.appendChild(document.createTextNode(line));
						statusNotice.appendChild(document.createElement('br'));
					});
				}

				function displayFailureNotice(err) {
					console.error(err);
					if (err instanceof Error) {
						setStatusNotice(err.message);
					} else if (typeof err === 'string') {
						setStatusNotice(err);
					} else {
						setStatusNotice('Đã xảy ra lỗi khi khởi chạy trò chơi.');
					}
					setStatusMode('notice');
					initializing = false;
				}

				const missing = Engine.getMissingFeatures({
					threads: GODOT_THREADS_ENABLED,
				});

				if (missing.length !== 0) {
					if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
						let serviceWorkerRegistrationPromise;
						try {
							serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
						} catch (err) {
							serviceWorkerRegistrationPromise = Promise.reject(new Error('Không thể đăng ký service worker.'));
						}
						Promise.race([
							serviceWorkerRegistrationPromise.then((registration) => {
								if (registration != null) {
									return Promise.reject(new Error('Service worker đã được đăng ký.'));
								}
								return registration;
							}).then(() => engine.installServiceWorker()),
							new Promise((resolve) => setTimeout(resolve, 2000)),
						]).then(() => {
							window.location.reload();
						}).catch((err) => {
							console.error('Error while registering service worker:', err);
						});
					} else {
						displayFailureNotice('Trình duyệt chưa hỗ trợ các tính năng cần thiết để chạy trò chơi:\n' + missing.join('\n'));
					}
				} else {
					setStatusMode('progress');
					engine.startGame({
						'onProgress': (current, total) => {
							if (Number.isFinite(current) && current >= 0 && Number.isFinite(total) && total > 0) {
								const isDownloaded = current >= total;
								const percent = Math.min(100, Math.floor((current / total) * 100));
								statusProgress.value = Math.min(current, total);
								statusProgress.max = total;
								statusPercent.textContent = `${percent}%`;
								statusLabel.textContent = isDownloaded ? 'Đang khởi động trò chơi…' : 'Đang tải trò chơi…';
								progressTrack.classList.add('is-measured');
							} else {
								statusProgress.removeAttribute('value');
								statusProgress.removeAttribute('max');
								statusPercent.textContent = '…';
								progressTrack.classList.remove('is-measured');
							}
						},
					}).then(() => {
						setStatusMode('hidden');
					}, displayFailureNotice);
				}

				if ('serviceWorker' in navigator) {
					navigator.serviceWorker.getRegistration().then((reg) => {
						if (!reg) return;
						reg.update().catch(() => {});
						if (reg.waiting) {
							reg.waiting.postMessage('claim');
						}
						reg.addEventListener('updatefound', () => {
							const worker = reg.installing;
							if (worker) {
								worker.addEventListener('statechange', () => {
									if (worker.state === 'installed' && navigator.serviceWorker.controller) {
										worker.postMessage('claim');
									}
								});
							}
						});
					}).catch(() => {});
				}
			})());
		</script>
	</body>
</html>
