<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
		<meta name="theme-color" content="#16233F">
		<title>Xóm Đảo</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: "Be Vietnam Pro", "Nunito", "Segoe UI", "Trebuchet MS", Arial, sans-serif;
				font-synthesis: none;
				--navy: #16233F;
				--navy-deep: #0E172C;
				--navy-hud: rgba(22, 35, 63, 0.86);
				--navy-line: #3B5683;
				--cream: #FFF6E3;
				--cream-muted: rgba(255, 246, 227, 0.82);
				--sun: #FFD54A;
				--gold: #E7B53C;
				--gold-dark: #B9822A;
				--sea: #3EC1C9;
				--sea-deep: #1E8FA6;
				--lantern: #E0352B;
			}

			html,
			body {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				border: 0;
				overflow: hidden;
				overscroll-behavior: none;
			}

			body {
				background: var(--navy);
				touch-action: none;
			}

			#canvas {
				display: block;
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				border: 0;
				outline: none;
			}

			body > input,
			body > textarea {
				top: 0px !important;
				left: 0px !important;
				height: 44px !important;
				font-size: 16px !important;
				color: transparent !important;
				background: transparent !important;
				caret-color: transparent !important;
			}

			/* Matches HubLoading (apps/client/hub/loading.gd): deep navy sea + warm coastal horizon + navy shade */
			#status {
				position: fixed;
				inset: 0;
				z-index: 10;
				display: flex;
				align-items: center;
				justify-content: center;
				padding:
					max(16px, calc(env(safe-area-inset-top, 0px) + 10px))
					max(18px, calc(env(safe-area-inset-right, 0px) + 14px))
					max(16px, calc(env(safe-area-inset-bottom, 0px) + 10px))
					max(18px, calc(env(safe-area-inset-left, 0px) + 14px));
				box-sizing: border-box;
				overflow: hidden;
				isolation: isolate;
				color: var(--cream);
				background:
					radial-gradient(ellipse 80% 60% at 50% 18%, rgba(62, 193, 201, 0.22), transparent 72%),
					radial-gradient(ellipse 58% 42% at 50% 44%, rgba(255, 213, 74, 0.14), transparent 72%),
					linear-gradient(180deg, #1E3A63 0%, #1B4B72 38%, #194E6E 62%, #16233F 100%);
				visibility: visible;
			}

			/* Top & bottom navy vignette matching HubLoading._draw_shade() */
			#status::before {
				position: absolute;
				inset: 0;
				z-index: -1;
				background:
					linear-gradient(180deg, rgba(22, 35, 63, 0.42) 0%, transparent 24%),
					linear-gradient(180deg, transparent 34%, rgba(22, 35, 63, 0.94) 100%);
				content: "";
				pointer-events: none;
			}

			.backdrop-clouds {
				position: absolute;
				inset: 0;
				z-index: -2;
				pointer-events: none;
				overflow: hidden;
			}

			.cloud {
				position: absolute;
				width: clamp(120px, 19vw, 270px);
				color: rgba(255, 246, 227, 0.1);
				animation: cloud-drift 12s ease-in-out infinite alternate;
			}

			.cloud svg {
				display: block;
				width: 100%;
				height: auto;
			}

			.cloud-left {
				top: 12%;
				left: -2%;
			}

			.cloud-right {
				top: 18%;
				right: -2%;
				width: clamp(100px, 15vw, 220px);
				animation-delay: -5s;
			}

			.backdrop-islands {
				position: absolute;
				right: 0;
				bottom: 0;
				left: 0;
				z-index: -2;
				height: clamp(120px, 34vh, 300px);
				pointer-events: none;
				opacity: 0.72;
			}

			.backdrop-islands svg {
				display: block;
				width: 100%;
				height: 100%;
			}

			.loader-shell {
				position: relative;
				z-index: 2;
				width: min(840px, 100%);
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 20px;
			}

			.brand-header {
				display: flex;
				align-items: center;
				gap: 14px;
			}

			.island-badge {
				width: 64px;
				height: 64px;
				flex: 0 0 auto;
				border-radius: 50%;
				overflow: hidden;
				border: 3px solid var(--sun);
				background: var(--navy);
				box-shadow:
					0 6px 18px rgba(10, 16, 32, 0.45),
					0 0 0 3px rgba(22, 35, 63, 0.85);
				animation: island-bob 4.8s ease-in-out infinite;
			}

			.island-badge img {
				display: block;
				width: 100%;
				height: 100%;
				object-fit: cover;
				transform: scale(1.22);
			}

			.brand-titles {
				display: flex;
				flex-direction: column;
				gap: 2px;
			}

			.brand-kicker {
				color: var(--sun);
				font-size: 13px;
				font-weight: 800;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				text-shadow: 0 2px 6px rgba(10, 16, 32, 0.9);
			}

			.brand-name {
				color: var(--cream);
				font-size: clamp(26px, 4.2vw, 38px);
				font-weight: 900;
				letter-spacing: 0.06em;
				line-height: 1.05;
				text-shadow:
					0 3px 0 rgba(22, 35, 63, 0.95),
					0 6px 16px rgba(10, 16, 32, 0.65);
			}

			/* Main HUD panel matching XomDaoUi.NAVY_HUD + NAVY_LINE */
			.loader-card {
				width: 100%;
				box-sizing: border-box;
				padding: 26px 30px 24px;
				border: 2.5px solid var(--navy-line);
				border-radius: 24px;
				background: linear-gradient(180deg, rgba(22, 35, 63, 0.88) 0%, rgba(14, 23, 44, 0.95) 100%);
				box-shadow:
					0 16px 38px rgba(8, 14, 28, 0.55),
					inset 0 1px 0 rgba(255, 246, 227, 0.14);
				backdrop-filter: blur(8px);
			}

			.loading-caption {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
				margin-bottom: 14px;
			}

			.loading-label {
				display: flex;
				min-width: 0;
				align-items: center;
				gap: 12px;
				color: var(--cream);
				font-size: clamp(18px, 2.5vw, 22px);
				font-weight: 800;
				text-shadow: 0 2px 4px rgba(10, 16, 32, 0.9);
			}

			#status-label {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			/* Godot HubLoading / HubWait circular arc spinner */
			.spinner {
				width: 30px;
				height: 30px;
				flex: 0 0 auto;
				animation: spin 1.15s linear infinite;
			}

			.spinner svg {
				display: block;
				width: 100%;
				height: 100%;
			}

			#status-percent {
				flex: 0 0 auto;
				min-width: 3.5ch;
				color: var(--sun);
				font-size: clamp(32px, 5vw, 46px);
				font-variant-numeric: tabular-nums;
				font-weight: 900;
				line-height: 1;
				text-align: right;
				text-shadow:
					0 2px 0 rgba(22, 35, 63, 0.95),
					0 4px 12px rgba(255, 213, 74, 0.25);
			}

			/* Hero progress bar: large, raised XomDaoPuff-style gold bar */
			.progress-track {
				position: relative;
				height: 52px;
				padding: 5px;
				box-sizing: border-box;
				overflow: hidden;
				border: 2.5px solid var(--navy-line);
				border-radius: 999px;
				background: var(--navy-deep);
				box-shadow:
					inset 0 3px 8px rgba(5, 10, 22, 0.72),
					0 2px 0 rgba(255, 246, 227, 0.08);
			}

			.progress-inner {
				position: relative;
				width: 100%;
				height: 100%;
				overflow: hidden;
				border-radius: 999px;
			}

			.progress-fill {
				position: relative;
				width: 0%;
				height: 100%;
				min-width: 0;
				border-radius: 999px;
				background: linear-gradient(180deg, #FFE47A 0%, var(--sun) 48%, var(--gold) 100%);
				box-shadow:
					inset 0 2px 0 rgba(255, 255, 255, 0.52),
					inset 0 -4px 0 var(--gold-dark),
					0 0 18px rgba(255, 213, 74, 0.36);
				transition: width 160ms ease-out;
				overflow: hidden;
			}

			.progress-fill::after {
				position: absolute;
				inset: 0;
				background: linear-gradient(
					110deg,
					transparent 20%,
					rgba(255, 255, 255, 0.36) 45%,
					transparent 70%
				);
				transform: translateX(-100%);
				animation: bar-shine 2.2s ease-in-out infinite;
				content: "";
			}

			.progress-track:not(.is-measured) .progress-fill {
				display: none;
			}

			.progress-sheen {
				position: absolute;
				top: 0;
				left: 0;
				width: 34%;
				height: 100%;
				border-radius: 999px;
				background: linear-gradient(180deg, #FFE47A 0%, var(--sun) 48%, var(--gold) 100%);
				box-shadow:
					inset 0 2px 0 rgba(255, 255, 255, 0.52),
					inset 0 -4px 0 var(--gold-dark),
					0 0 16px rgba(255, 213, 74, 0.35);
				animation: sail 1.7s ease-in-out infinite;
			}

			.progress-track.is-measured .progress-sheen {
				display: none;
			}

			#status-progress {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				margin: 0;
				opacity: 0;
				pointer-events: none;
			}

			.comfort-box {
				display: flex;
				align-items: flex-start;
				gap: 12px;
				margin-top: 18px;
				padding-top: 16px;
				border-top: 1px solid rgba(59, 86, 131, 0.55);
			}

			.comfort-icon {
				width: 22px;
				height: 22px;
				margin-top: 2px;
				flex: 0 0 auto;
				color: var(--sun);
			}

			.comfort-icon svg {
				display: block;
				width: 100%;
				height: 100%;
			}

			.comfort-copy {
				display: flex;
				flex-direction: column;
				gap: 4px;
				min-width: 0;
			}

			.comfort-text {
				margin: 0;
				color: var(--cream);
				font-size: 14.5px;
				font-weight: 600;
				line-height: 1.48;
			}

			.comfort-hint {
				margin: 0;
				color: rgba(255, 213, 74, 0.92);
				font-size: 13.5px;
				font-weight: 700;
				line-height: 1.42;
			}

			#status-notice {
				display: none;
				margin: 14px 0 0;
				padding: 12px 15px;
				border: 1.5px solid var(--lantern);
				border-radius: 14px;
				background: rgba(184, 38, 42, 0.25);
				color: var(--cream);
				font-size: 14px;
				font-weight: 600;
				line-height: 1.48;
				text-align: center;
				white-space: normal;
			}

			.noscript {
				position: absolute;
				z-index: 20;
				bottom: 18px;
				left: 50%;
				padding: 10px 16px;
				border: 2px solid var(--navy-line);
				border-radius: 14px;
				background: var(--navy);
				color: var(--cream);
				font-size: 14px;
				font-weight: 700;
				transform: translateX(-50%);
				white-space: nowrap;
			}

			@keyframes island-bob {
				0%, 100% { transform: translateY(0); }
				50% { transform: translateY(-5px); }
			}

			@keyframes cloud-drift {
				from { transform: translate3d(0, 0, 0); }
				to { transform: translate3d(12px, -5px, 0); }
			}

			@keyframes spin {
				to { transform: rotate(360deg); }
			}

			@keyframes sail {
				0% { transform: translateX(-115%); }
				100% { transform: translateX(310%); }
			}

			@keyframes bar-shine {
				0%, 35% { transform: translateX(-120%); }
				100% { transform: translateX(220%); }
			}

			@media (max-height: 480px) {
				.loader-shell {
					gap: 10px;
				}

				.island-badge {
					width: 48px;
					height: 48px;
					border-width: 2.5px;
				}

				.brand-kicker {
					font-size: 11px;
				}

				.brand-name {
					font-size: 23px;
				}

				.loader-card {
					padding: 16px 20px 15px;
					border-radius: 20px;
				}

				.loading-caption {
					margin-bottom: 10px;
				}

				.loading-label {
					gap: 9px;
					font-size: 17px;
				}

				.spinner {
					width: 24px;
					height: 24px;
				}

				#status-percent {
					font-size: 30px;
				}

				.progress-track {
					height: 36px;
					padding: 3.5px;
				}

				.comfort-box {
					gap: 10px;
					margin-top: 12px;
					padding-top: 11px;
				}

				.comfort-icon {
					width: 19px;
					height: 19px;
				}

				.comfort-text {
					font-size: 13px;
					line-height: 1.4;
				}

				.comfort-hint {
					font-size: 12.5px;
					line-height: 1.35;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					animation-duration: 0.01ms !important;
					animation-iteration-count: 1 !important;
					scroll-behavior: auto !important;
				}
			}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas" aria-label="Xóm Đảo">
			Trình duyệt của bạn không hỗ trợ canvas.
		</canvas>

		<noscript><div class="noscript">Hãy bật JavaScript để vào Xóm Đảo.</div></noscript>

		<div id="status" role="status" aria-live="polite" aria-label="Đang tải Xóm Đảo">
			<div class="backdrop-clouds" aria-hidden="true">
				<div class="cloud cloud-left">
					<svg viewBox="0 0 240 100" fill="none" aria-hidden="true"><path d="M20 67c0-16 13-29 30-29 7-21 27-34 49-31 18 2 33 15 38 32 6-5 13-8 21-8 18 0 32 14 32 32h9c18 0 32 12 32 27H25C10 90 1 81 1 69c0-1 7-2 19-2Z" fill="currentColor"/></svg>
				</div>
				<div class="cloud cloud-right">
					<svg viewBox="0 0 240 100" fill="none" aria-hidden="true"><path d="M20 67c0-16 13-29 30-29 7-21 27-34 49-31 18 2 33 15 38 32 6-5 13-8 21-8 18 0 32 14 32 32h9c18 0 32 12 32 27H25C10 90 1 81 1 69c0-1 7-2 19-2Z" fill="currentColor"/></svg>
				</div>
			</div>
			<div class="backdrop-islands" aria-hidden="true">
				<svg viewBox="0 0 1440 240" preserveAspectRatio="none" fill="none" aria-hidden="true">
					<path d="M0 165c62-12 104-64 152-64s78 46 134 52c68 8 106-94 176-94s108 82 178 92c92 14 146-32 224-32s102 48 172 42c72-6 116-76 184-76s106 54 166 64c22 4 38 5 54 4v87H0v-75Z" fill="#122747" fill-opacity="0.72"/>
					<path d="M0 194c145-18 244-16 376 0 132 16 254 14 386-4 134-18 258-12 384 6 112 16 208 14 294-2v46H0v-46Z" fill="#0F203B" fill-opacity="0.88"/>
				</svg>
			</div>

			<main class="loader-shell">
				<div class="brand-header">
					<div class="island-badge" aria-hidden="true">
						<img src="index.icon.png" alt="">
					</div>
					<div class="brand-titles">
						<span class="brand-kicker">Cổng trò chơi dân gian</span>
						<span class="brand-name">XÓM ĐẢO</span>
					</div>
				</div>

				<div class="loader-card">
					<div class="loading-caption">
						<span class="loading-label">
							<span id="status-spinner" class="spinner" aria-hidden="true">
								<svg viewBox="0 0 36 36" fill="none" aria-hidden="true">
									<circle cx="18" cy="18" r="13" stroke="rgba(255, 246, 227, 0.25)" stroke-width="5"/>
									<path d="M18 5a13 13 0 0 1 12.4 9.1" stroke="#FFD54A" stroke-width="5" stroke-linecap="round"/>
								</svg>
							</span>
							<span id="status-label">Đang tải trò chơi…</span>
						</span>
						<span id="status-percent">…</span>
					</div>

					<div class="progress-track">
						<div class="progress-inner">
							<span class="progress-sheen" aria-hidden="true"></span>
							<div id="status-fill" class="progress-fill" aria-hidden="true"></div>
						</div>
						<progress id="status-progress" aria-label="Tiến trình tải"></progress>
					</div>

					<div class="comfort-box">
						<span class="comfort-icon" aria-hidden="true">
							<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm1 14.5a1 1 0 0 1-2 0V11a1 1 0 0 1 2 0Zm-1-7.75A1.25 1.25 0 1 1 13.25 7.5 1.25 1.25 0 0 1 12 8.75Z"/></svg>
						</span>
						<div class="comfort-copy">
							<p class="comfort-text">Xóm Đảo đang chạy trên hạ tầng miễn phí nên lần tải đầu hoặc lúc máy chủ khởi động lại (cold start) có thể rất chậm.</p>
							<p id="status-hint" class="comfort-hint">Bạn kiên nhẫn chờ một chút nhé, tải xong là vào chơi mượt ngay!</p>
						</div>
					</div>

					<div id="status-notice" role="alert"></div>
				</div>
			</main>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
			const GODOT_CONFIG = $GODOT_CONFIG;
			const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
			// Let the browser handle F11 before Godot's focused canvas can consume it.
			window.addEventListener('keydown', (event) => {
				if (event.key === 'F11') {
					event.stopImmediatePropagation();
				}
			}, true);

			// Keep the game screen stable on mobile so native status bar, navigation controls,
			// and virtual keyboard overlay on top instead of shrinking or shifting the UI.
			(() => {
				const isMobileTouch = () =>
					('ontouchstart' in window || navigator.maxTouchPoints > 0) &&
					window.matchMedia('(pointer: coarse)').matches;
				const widthDesc = Object.getOwnPropertyDescriptor(window, 'innerWidth');
				const heightDesc = Object.getOwnPropertyDescriptor(window, 'innerHeight');
				if (widthDesc?.get && widthDesc.configurable && heightDesc?.get && heightDesc.configurable) {
					const readWidth = () => widthDesc.get.call(window);
					const readHeight = () => heightDesc.get.call(window);
					let stableWidth = 0;
					let stableHeight = 0;
					let stableLandscape = null;

					const isKeyboardInputFocused = () => {
						const active = document.activeElement;
						return !!active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
					};

					const syncStableSize = () => {
						if (!isMobileTouch()) {
							stableWidth = 0;
							stableHeight = 0;
							stableLandscape = null;
							return;
						}
						const w = readWidth();
						const h = readHeight();
						if (w <= 0 || h <= 0) return;
						const nowLandscape = w >= h;
						if (stableLandscape === null) {
							stableWidth = w;
							stableHeight = h;
							stableLandscape = nowLandscape;
							return;
						}
						if (isKeyboardInputFocused()) {
							return;
						}
						if (
							nowLandscape !== stableLandscape &&
							Math.max(w, h) >= Math.max(stableWidth, stableHeight) * 0.8 &&
							Math.min(w, h) >= Math.min(stableWidth, stableHeight) * 0.8
						) {
							stableWidth = w;
							stableHeight = h;
							stableLandscape = nowLandscape;
							return;
						}
						if (nowLandscape === stableLandscape) {
							stableWidth = Math.max(stableWidth, w);
							stableHeight = Math.max(stableHeight, h);
						}
					};

					syncStableSize();
					window.addEventListener('resize', syncStableSize);
					window.addEventListener('orientationchange', syncStableSize);

					Object.defineProperty(window, 'innerWidth', {
						configurable: true,
						enumerable: widthDesc.enumerable,
						get() {
							syncStableSize();
							return isMobileTouch() && stableWidth > 0 ? stableWidth : readWidth();
						},
					});
					Object.defineProperty(window, 'innerHeight', {
						configurable: true,
						enumerable: heightDesc.enumerable,
						get() {
							syncStableSize();
							return isMobileTouch() && stableHeight > 0 ? stableHeight : readHeight();
						},
					});
				}

				const resetScroll = () => {
					if (window.scrollX !== 0 || window.scrollY !== 0) {
						window.scrollTo(0, 0);
					}
				};
				window.addEventListener('scroll', resetScroll, { passive: true });
				window.addEventListener('focusin', resetScroll);
				window.addEventListener('focusout', () => setTimeout(resetScroll, 0));
				if (window.visualViewport) {
					window.visualViewport.addEventListener('resize', resetScroll);
					window.visualViewport.addEventListener('scroll', resetScroll);
				}
			})();

			const engine = new Engine(GODOT_CONFIG);

			((() => {
				const statusOverlay = document.getElementById('status');
				const statusProgress = document.getElementById('status-progress');
				const statusFill = document.getElementById('status-fill');
				const statusLabel = document.getElementById('status-label');
				const statusPercent = document.getElementById('status-percent');
				const statusSpinner = document.getElementById('status-spinner');
				const statusHint = document.getElementById('status-hint');
				const progressTrack = document.querySelector('.progress-track');
				const statusNotice = document.getElementById('status-notice');

				let initializing = true;
				let statusMode = '';
				let downloaded = false;

				const hintTimers = [
					setTimeout(() => {
						if (initializing && !downloaded) {
							statusHint.textContent = 'Vẫn đang tải tài nguyên — cảm ơn bạn đã kiên nhẫn chờ thêm chút nữa nhé!';
						}
					}, 15_000),
					setTimeout(() => {
						if (initializing && !downloaded) {
							statusHint.textContent = 'Mạng hoặc máy chủ miễn phí phản hồi hơi chậm lúc khởi động, quá trình tải vẫn đang chạy…';
						}
					}, 35_000),
				];

				function clearHintTimers() {
					while (hintTimers.length) {
						clearTimeout(hintTimers.pop());
					}
				}

				function setStatusMode(mode) {
					if (statusMode === mode || !initializing) {
						return;
					}
					if (mode === 'hidden') {
						clearHintTimers();
						statusOverlay.remove();
						initializing = false;
						return;
					}
					statusOverlay.style.visibility = 'visible';
					const showProgress = mode === 'progress';
					statusProgress.style.display = showProgress ? 'block' : 'none';
					progressTrack.style.display = showProgress ? 'block' : 'none';
					statusSpinner.style.display = showProgress ? 'block' : 'none';
					statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
					statusMode = mode;
				}

				function setStatusNotice(text) {
					while (statusNotice.lastChild) {
						statusNotice.removeChild(statusNotice.lastChild);
					}
					const lines = text.split('\n');
					lines.forEach((line) => {
						statusNotice.appendChild(document.createTextNode(line));
						statusNotice.appendChild(document.createElement('br'));
					});
				}

				function displayFailureNotice(err) {
					console.error(err);
					clearHintTimers();
					if (err instanceof Error) {
						setStatusNotice(err.message);
					} else if (typeof err === 'string') {
						setStatusNotice(err);
					} else {
						setStatusNotice('Đã xảy ra lỗi khi khởi chạy trò chơi.');
					}
					setStatusMode('notice');
					initializing = false;
				}

				const missing = Engine.getMissingFeatures({
					threads: GODOT_THREADS_ENABLED,
				});

				if (missing.length !== 0) {
					if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
						let serviceWorkerRegistrationPromise;
						try {
							serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
						} catch (err) {
							serviceWorkerRegistrationPromise = Promise.reject(new Error('Không thể đăng ký service worker.'));
						}
						Promise.race([
							serviceWorkerRegistrationPromise.then((registration) => {
								if (registration != null) {
									return Promise.reject(new Error('Service worker đã được đăng ký.'));
								}
								return registration;
							}).then(() => engine.installServiceWorker()),
							new Promise((resolve) => setTimeout(resolve, 2000)),
						]).then(() => {
							window.location.reload();
						}).catch((err) => {
							console.error('Error while registering service worker:', err);
						});
					} else {
						displayFailureNotice('Trình duyệt chưa hỗ trợ các tính năng cần thiết để chạy trò chơi:\n' + missing.join('\n'));
					}
				} else {
					setStatusMode('progress');
					engine.startGame({
						'onProgress': (current, total) => {
							if (Number.isFinite(current) && current >= 0 && Number.isFinite(total) && total > 0) {
								const isDownloaded = current >= total;
								const ratio = Math.min(1, current / total);
								const percent = Math.min(100, Math.floor(ratio * 100));
								statusProgress.value = Math.min(current, total);
								statusProgress.max = total;
								statusFill.style.width = `${(ratio * 100).toFixed(1)}%`;
								statusFill.style.minWidth = current > 0 ? '20px' : '0px';
								statusPercent.textContent = `${percent}%`;
								statusLabel.textContent = isDownloaded ? 'Đang khởi động trò chơi…' : 'Đang tải trò chơi…';
								if (isDownloaded && !downloaded) {
									downloaded = true;
									clearHintTimers();
									statusHint.textContent = 'Đã tải xong dữ liệu, đang khởi động bộ máy và đánh thức máy chủ…';
								}
								progressTrack.classList.add('is-measured');
							} else {
								statusProgress.removeAttribute('value');
								statusProgress.removeAttribute('max');
								statusFill.style.width = '0%';
								statusFill.style.minWidth = '0px';
								statusPercent.textContent = '…';
								progressTrack.classList.remove('is-measured');
							}
						},
					}).then(() => {
						setStatusMode('hidden');
					}, displayFailureNotice);
				}

				if ('serviceWorker' in navigator) {
					navigator.serviceWorker.getRegistration().then((reg) => {
						if (!reg) return;
						reg.update().catch(() => {});
						if (reg.waiting) {
							reg.waiting.postMessage('claim');
						}
						reg.addEventListener('updatefound', () => {
							const worker = reg.installing;
							if (worker) {
								worker.addEventListener('statechange', () => {
									if (worker.state === 'installed' && navigator.serviceWorker.controller) {
										worker.postMessage('claim');
									}
								});
							}
						});
					}).catch(() => {});
				}
			})());
		</script>
	</body>
</html>
