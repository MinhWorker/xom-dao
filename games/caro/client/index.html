<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Caro</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="table">
      <section class="seat" id="seat-left" data-mark="X">
        <span class="mark"><span class="glyph" aria-hidden="true"></span><span class="wins"></span></span>
        <span class="name"></span>
        <span class="who"></span>
        <span class="turn">Đến lượt</span>
        <button class="swap" type="button" hidden>Đổi bên</button>
      </section>
      <canvas id="board" aria-label="Bàn cờ"></canvas>
      <section class="seat" id="seat-right" data-mark="O">
        <span class="mark"><span class="glyph" aria-hidden="true"></span><span class="wins"></span></span>
        <span class="name"></span>
        <span class="who"></span>
        <span class="turn">Đến lượt</span>
        <button class="swap" type="button" hidden>Đổi bên</button>
      </section>
    </main>
    <p class="toast" id="toast" role="status"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
