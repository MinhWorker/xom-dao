<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0c0b1e" />
    <title>Cờ Tỷ Phú</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="view" aria-label="Bàn cờ"></canvas>
    <ol class="roster" id="roster"></ol>
    <section class="panel" id="panel" hidden>
      <div class="clock" id="clock"><i></i></div>
      <p class="title" id="panel-title"></p>
      <p id="panel-text"></p>
      <div class="buttons" id="panel-buttons"></div>
    </section>
    <section class="info" id="info" hidden></section>
    <p class="banner" id="banner" role="status" hidden></p>
    <p class="toast" id="toast" role="alert"></p>
    <section class="end" id="end" hidden>
      <svg class="crown" viewBox="0 0 64 40" aria-hidden="true">
        <path d="M4 34 8 8l14 14L32 2l10 20L56 8l4 26z" fill="#f6d77a" stroke="#b07d12" stroke-width="2.5" stroke-linejoin="round" />
        <circle cx="32" cy="24" r="4" fill="#e0553d" />
        <circle cx="16" cy="27" r="3" fill="#4a8fe0" />
        <circle cx="48" cy="27" r="3" fill="#58b368" />
      </svg>
      <p class="title" id="end-title"></p>
      <ol id="end-places"></ol>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
