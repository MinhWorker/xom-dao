<svg xmlns="http://www.w3.org/2000/svg" width="96" height="72" viewBox="0 0 96 72">
  <title>Cọc tiền và vàng</title>
  <defs>
    <linearGradient id="billTop" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="billMid" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="billBot" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="goldBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <rect x="5" y="32" width="64" height="34" rx="6" fill="#1E293B" opacity="0.25"/>
  <!-- Bottom Bill -->
  <rect x="4" y="27" width="64" height="36" rx="6" fill="url(#billBot)" stroke="#064E3B" stroke-width="2.5"/>
  <!-- Middle Bill -->
  <rect x="7" y="18" width="64" height="36" rx="6" fill="url(#billMid)" stroke="#064E3B" stroke-width="2.5"/>
  <!-- Top Bill -->
  <rect x="10" y="9" width="64" height="36" rx="6" fill="url(#billTop)" stroke="#064E3B" stroke-width="2.5"/>
  <rect x="14" y="14" width="56" height="26" rx="4" fill="none" stroke="#A7F3D0" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- Golden currency strap -->
  <rect x="36" y="8" width="14" height="38" rx="2" fill="url(#goldBand)" stroke="#92400E" stroke-width="1.5"/>
  <!-- Stack of Gold Coins on right -->
  <ellipse cx="76" cy="54" rx="16" ry="8" fill="#92400E"/>
  <ellipse cx="76" cy="50" rx="16" ry="8" fill="url(#coinGrad)" stroke="#92400E" stroke-width="1.5"/>
  <ellipse cx="76" cy="44" rx="16" ry="8" fill="#92400E"/>
  <ellipse cx="76" cy="40" rx="16" ry="8" fill="url(#coinGrad)" stroke="#92400E" stroke-width="1.5"/>
  <ellipse cx="76" cy="34" rx="16" ry="8" fill="#92400E"/>
  <ellipse cx="76" cy="30" rx="16" ry="8" fill="url(#coinGrad)" stroke="#92400E" stroke-width="1.5"/>
  <circle cx="76" cy="30" r="3" fill="#FEF08A"/>
</svg>
