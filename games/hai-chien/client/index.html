<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#173452" />
    <title>Hải Chiến</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="view" aria-label="Mặt biển"></canvas>
    <section class="seat" id="seat-them">
      <span class="avatar" aria-hidden="true"><span class="initial"></span><img alt="" draggable="false" hidden /></span>
      <span class="info"><span class="name"></span><span class="who"></span></span>
      <span class="wins"></span>
      <ol class="roster" aria-label="Hạm đội"></ol>
      <span class="turn">Đến lượt</span>
    </section>
    <section class="dock" id="dock">
      <section class="seat" id="seat-me">
        <span class="avatar" aria-hidden="true"><span class="initial"></span><img alt="" draggable="false" hidden /></span>
        <span class="info"><span class="name"></span><span class="who"></span></span>
        <span class="wins"></span>
        <ol class="roster" aria-label="Hạm đội"></ol>
        <span class="turn">Đến lượt</span>
      </section>
      <div class="actions">
        <button class="act" id="look" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h13M12 7l5 5-5 5M20 5v14" /></svg>
          <span>Biển ta</span>
        </button>
        <button class="act" id="shuffle" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l10 10h3M4 17h3l3-3M14 10l3-3h3M18 4l2 3-2 3M18 14l2 3-2 3" /></svg>
          <span>Xếp lại</span>
        </button>
        <button class="act" id="radar" type="button" hidden aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="3.5" /><path d="M12 12l6-5" /></svg>
          <span>Ra-đa</span><b class="count"></b>
        </button>
        <button class="act primary" id="go" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" /><path d="M12 2v5M12 17v5M2 12h5M17 12h5" /></svg>
          <span>Bắn</span>
        </button>
      </div>
    </section>
    <p class="status" id="status" role="status"></p>
    <p class="banner" id="banner" aria-live="polite"></p>
    <p class="toast" id="toast" role="status"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
