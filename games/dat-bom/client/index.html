<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#12141c" />
    <title>Đặt Bom</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="view" aria-label="Sân đấu"></canvas>
    <header class="hud">
      <ol class="roster" id="roster"></ol>
      <p class="clock" id="clock">3:00</p>
    </header>
    <p class="banner" id="banner" role="status"></p>
    <div class="pad" id="pad" aria-hidden="true">
      <span class="key up" data-dir="up"><i></i></span>
      <span class="key left" data-dir="left"><i></i></span>
      <span class="key right" data-dir="right"><i></i></span>
      <span class="key down" data-dir="down"><i></i></span>
    </div>
    <button class="bomb" id="bomb" type="button" aria-label="Đặt bom">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="22" cy="28" r="13" />
        <path d="M30 14l5-5M33 7l2 2M37 11l-2-2" />
      </svg>
    </button>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
