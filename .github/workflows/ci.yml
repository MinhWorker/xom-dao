name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Godot client quality checks and GUT unit tests. Runs in parallel with check and web exports.
  godot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: |
            .tools/godot
            .tools/gdtoolkit
            apps/client/addons/gut
          key: godot-check-${{ runner.os }}-${{ hashFiles('tools/godot/version.json') }}
      - run: npm run setup:godot
      - run: npm run godot:check
      # The SDK against a real server (dev, no database): two clients play Caro by room code.
      - run: npm run godot:net

  # Production web export and headless smoke test.
  godot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: |
            .tools/godot
            .tools/export/packs
          key: godot-export-${{ runner.os }}-${{ hashFiles('tools/godot/version.json') }}-${{ github.sha }}
          restore-keys: |
            godot-export-${{ runner.os }}-${{ hashFiles('tools/godot/version.json') }}-
            godot-export-${{ runner.os }}-
      - run: npm run setup:godot -- --export-only
      - run: npm run godot:export
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run godot:smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: godot-smoke
          path: .shots/
          include-hidden-files: true
          retention-days: 7

  # The e2e scenarios (scripts/e2e/scenarios/) in the debug build, sharded across parallel runners.
  e2e-run:
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check affected scenarios
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            list=$(node scripts/e2e.mjs --list --changed origin/${{ github.base_ref }} --shard ${{ matrix.shard }})
            echo "scenarios=$list" >> "$GITHUB_OUTPUT"
            if [ "$list" = "[]" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No scenarios in shard ${{ matrix.shard }} affected by PR changes. Skipping."
            fi
          fi
      - if: steps.plan.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: |
            .tools/godot
            .tools/export/packs
          key: godot-export-${{ runner.os }}-${{ hashFiles('tools/godot/version.json') }}-${{ github.sha }}
          restore-keys: |
            godot-export-${{ runner.os }}-${{ hashFiles('tools/godot/version.json') }}-
            godot-export-${{ runner.os }}-
      - if: steps.plan.outputs.skip != 'true'
        run: npm run setup:godot -- --export-only
      - if: steps.plan.outputs.skip != 'true'
        run: npm run godot:export -- --debug
      - if: steps.plan.outputs.skip != 'true'
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.plan.outputs.skip != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.plan.outputs.skip != 'true'
        name: Start the app
        env:
          BOT_DELAY_MS: 200
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 120); do
            curl -sf localhost:8033/api/health > /dev/null && curl -sf localhost:5033/ > /dev/null && exit 0
            sleep 1
          done
          cat dev.log; exit 1
      # Bots play Caro over the WebSocket against the running server.
      - if: steps.plan.outputs.skip != 'true'
        run: npm run smoke
      - if: steps.plan.outputs.skip != 'true'
        name: Run e2e scenarios
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run e2e -- --changed origin/${{ github.base_ref }} --shard ${{ matrix.shard }} --retries 1
          else
            npm run e2e -- --shard ${{ matrix.shard }} --retries 1
          fi
      - if: steps.plan.outputs.skip != 'true' && failure()
        name: Dev server log
        run: cat dev.log
      - if: steps.plan.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-e2e-shard-${{ replace(matrix.shard, '/', '-') }}
          path: |
            .shots/
            .e2e/
          # Both folders start with a dot: without this the upload finds nothing.
          include-hidden-files: true
          retention-days: 7

  # The required check (branch protection): verifies that all checks and e2e shards passed.
  e2e:
    needs: [check, godot-check, godot-smoke, e2e-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHECK: ${{ needs.check.result }}
          GODOT_CHECK: ${{ needs.godot-check.result }}
          GODOT_SMOKE: ${{ needs.godot-smoke.result }}
          E2E_RUN: ${{ needs.e2e-run.result }}
        run: |
          echo "check: $CHECK, godot-check: $GODOT_CHECK, godot-smoke: $GODOT_SMOKE, e2e-run: $E2E_RUN"
          [ "$CHECK" = success ] && [ "$GODOT_CHECK" = success ] && [ "$GODOT_SMOKE" = success ] && [ "$E2E_RUN" = success ]
