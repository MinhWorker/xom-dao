name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx turbo run typecheck test build ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      # A browser plays Đặt Bom against the real server through the Harness. Build what it runs
      # first: --affected may have skipped them.
      - run: npx turbo run build --filter=@xomdao/game-dat-bom --filter=@xomdao/harness --filter=@xomdao/server
      - run: npx playwright-core install --with-deps chromium
      - run: npm run smoke:web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-web
          path: smoke-web/
          if-no-files-found: ignore
