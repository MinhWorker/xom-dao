name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Tiến Lên's build exports its Godot client: install the pinned editor and web templates.
      - uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ hashFiles('tools/godot/version.json') }}
      - run: npm run setup:godot
      - run: npm run lint
      - run: npx turbo run typecheck test build ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      # Browsers play Đặt Bom through the Harness, use the Hub's friends and play Caro and Tiến Lên (Godot)
      # through the Hub against the real server. Build what they run first: --affected may have skipped them.
      - run: npx turbo run build --filter=@xomdao/game-dat-bom --filter=@xomdao/game-tic-tac-toe --filter=@xomdao/game-tien-len --filter=@xomdao/harness --filter=@xomdao/server
      - run: npx playwright-core install --with-deps chromium
      - run: npm run smoke:web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-web
          path: smoke-web/
          if-no-files-found: ignore
      # Friends and invites on the Hub: two browsers against the server and the dev Hub.
      - run: npm run smoke:hub
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-hub
          path: smoke-hub/
          if-no-files-found: ignore
      # The e2e plays the real Games, so a PR runs it only when a Game or what Games are built from
      # changed (the list below); every push to main runs it.
      - id: games
        env:
          EVENT: ${{ github.event_name }}
          BASE: origin/${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...HEAD" | grep -qE '^(games|packages|tools/godot|e2e)/|^scripts/(e2e|libs|game-version)\.mjs$|^(package-lock\.json|turbo\.json|\.github/workflows/ci\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Game changes: skipping the e2e."
          fi
      # Two browsers finish a Caro and a Tiến Lên match through the Hub, against the server and the dev Hub.
      - run: npm run e2e
        if: steps.games.outputs.run == 'true'
      - uses: actions/upload-artifact@v7
        if: always() && steps.games.outputs.run == 'true'
        with:
          name: e2e
          path: e2e/
          if-no-files-found: ignore
