<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 -40 1680 860" font-family="Baloo 2, system-ui, sans-serif">
  <title>Khung hình: khung 16:9 cố định 1280 × 720, viền đen, lõi 960 × 720, hai góc HUD và lề</title>
  <!-- The screen: black wherever the locked frame does not reach. -->
  <rect x="-200" y="-40" width="1680" height="860" fill="#111"/>
  <!-- The frame: always 1280×720 (16:9). -->
  <rect x="0" y="0" width="1280" height="720" fill="#e9f7fd" stroke="#2c5d7a" stroke-width="4"/>
  <!-- Core: 960×720, the middle of the frame. -->
  <rect x="160" y="0" width="960" height="720" fill="#fff4d6" stroke="#b5651d" stroke-width="5"/>
  <!-- Margin (player setting) and the HUD corners. -->
  <rect x="24" y="24" width="1232" height="672" fill="none" stroke="#7a3" stroke-width="3" stroke-dasharray="4 8"/>
  <rect x="24" y="24" width="440" height="88" rx="18" fill="#f2c14e" stroke="#8a5a14" stroke-width="3"/>
  <rect x="816" y="24" width="440" height="88" rx="18" fill="#f2c14e" stroke="#8a5a14" stroke-width="3"/>
  <!-- A board filling the core's height under the top bar. -->
  <rect x="296" y="128" width="688" height="568" rx="12" fill="#c98f4e" stroke="#6b3d12" stroke-width="4"/>
  <g font-size="30" font-weight="700" fill="#1d3b4f" text-anchor="middle">
    <text x="244" y="68">HUD trái</text>
    <text x="1036" y="68">HUD phải</text>
    <text x="640" y="420">Bàn chơi (trong lõi)</text>
  </g>
  <g font-size="30" font-weight="700" fill="#e9f7fd" text-anchor="middle">
    <text x="640" y="770">Khung 1280 × 720 (16:9), lõi 960 × 720 ở giữa</text>
  </g>
  <g font-size="24" fill="#1d3b4f">
    <text x="30" y="150" fill="#4a7a1e">lề 24 (chỉnh được)</text>
    <text x="172" y="700" fill="#b5651d">lõi 960</text>
  </g>
  <g font-size="24" fill="#bbb" text-anchor="middle">
    <text x="-100" y="366">viền đen</text>
    <text x="1380" y="366">viền đen</text>
  </g>
</svg>
